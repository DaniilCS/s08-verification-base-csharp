services:
  api:
    image: s08-demo:local
    build:
      context: .
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      APP_LABEL: ${APP_LABEL:-s08-compose}
    healthcheck:
      test: ["CMD", "dotnet", "SampleApi.dll", "--healthcheck"]
      interval: 5s
      timeout: 4s
      start_period: 5s
      retries: 12
